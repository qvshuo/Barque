{% extends "base.html" %}
{% block content %}
  <form id="login-form" method="post" action="{{ url_for('login') }}">
    <input class="input"
           id="access-password"
           name="password"
           type="password"
           aria-label="密码"
           placeholder="密码"
           autocomplete="current-password"
           required
           maxlength="256"
           autofocus>
    <p class="error" role="alert" {% if not login_error %}hidden{% endif %}>{{ login_error or '' }}{% if login_error %} <a href="/">返回登录</a>{% endif %}</p>
    {% if not login_error %}<noscript><p class="error">登录需要 JavaScript，请启用后重新加载页面。</p></noscript>{% endif %}
    <button class="btn" type="submit">登录</button>
  </form>
{% endblock %}
