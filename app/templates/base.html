<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color"
          content="#ffffff"
          media="(prefers-color-scheme: light)">
    <meta name="theme-color"
          content="#0a0a0a"
          media="(prefers-color-scheme: dark)">
    <title>Barque</title>
    <link rel="icon" href="{{ asset('favicon.ico') }}">
    <link rel="apple-touch-icon" href="{{ asset('apple-touch-icon.png') }}">
    <link rel="stylesheet" href="{{ asset('vendor/basecoat-1.1.0.min.css') }}">
    <link rel="stylesheet" href="{{ asset('app.css') }}">
    <script type="module" src="{{ asset('app.js') }}"></script>
  </head>
  <body data-page="{{ page }}">
    {% if page != "login" %}
      <header class="site-header">
        <div class="header-inner">
          <a class="brand" href="/" aria-label="Barque 首页">
            <img src="{{ asset('logo.webp') }}" width="32" height="32" alt="">
            <span>Barque</span>
          </a>
          <nav aria-label="主导航">
            {% for key, label, href in [('home','首页','/'),('subscriptions','订阅','/?page=subscriptions'),('settings','设置','/?page=settings')] %}
              <a class="btn" data-variant="ghost"
                 href="{{ href }}"
                 {% if page == key %} aria-current="page" {% endif %}>{{ label }}</a>
            {% endfor %}
          </nav>
          <button class="btn" data-variant="ghost" data-size="icon" id="logout" aria-label="退出登录">
            <svg width="20"
                 height="20"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4m7 14 5-5-5-5m5 5H9" />
            </svg>
          </button>
        </div>
      </header>
    {% endif %}
    <main {% if page == 'login' %} class="login" {% endif %}>
      {% block content %}{% endblock %}
    </main>
    <dialog id="reauth" class="dialog" aria-labelledby="reauth-title">
      <article><header><h2 id="reauth-title">重新登录</h2></header><section><form id="reauth-form">
        <input class="input" name="password" type="password" aria-label="重新登录密码" placeholder="密码" autocomplete="current-password" required maxlength="256">
        <p class="error" role="alert" hidden></p>
        <footer><button class="btn" type="submit">登录</button>
        <button class="btn" data-variant="outline" type="button" id="reauth-cancel">继续编辑</button></footer>
      </form></section></article>
    </dialog>
    <button id="reauth-open" class="btn" data-variant="outline" hidden>重新登录</button>
    <div id="feedback" role="status" aria-live="polite" hidden></div>
    <dialog id="confirm"
            class="dialog"
            role="alertdialog"
            aria-labelledby="confirm-title"
            aria-describedby="confirm-description">
      <article>
        <header>
          <h2 id="confirm-title"></h2>
          <p id="confirm-description"></p>
        </header>
        <footer>
          <button type="button" class="btn" data-variant="outline" id="confirm-cancel" autofocus>继续编辑</button>
          <button type="button" class="btn" data-variant="destructive" id="confirm-ok">放弃更改</button>
        </footer>
      </article>
    </dialog>
  </body>
</html>
