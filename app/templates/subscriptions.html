{% extends "base.html" %}
{% from 'forms.html' import group, subscription, savebar with context %}
{% block content %}
  <h1>订阅</h1>
  <form id="management" data-revision="{{ groups.revision }}">
    <fieldset>
      <div id="groups">
        {% for entry in groups.categories %}
          {{ group(entry) }}
        {% endfor %}
      </div>
      <button class="btn" data-variant="outline" type="button" data-action="add-group">＋ 添加分类</button>
    </fieldset>
    {{ savebar() }}
  </form>
  <datalist id="currencies">
    {% for code,name in currencies %}
      <option value="{{ code }}">{{ name }}</option>
    {% endfor %}
  </datalist>
  <template id="group-template">{{ group(blank_group) }}</template>
  <template id="subscription-template">{{ subscription(blank_subscription) }}</template>
{% endblock %}
